name: Build Windows Binary

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Decode certificate
        run: |
          $cert = [System.Convert]::FromBase64String("${{ secrets.SIGNING_CERT }}")
          [System.IO.File]::WriteAllBytes("cert.pfx", $cert)
        shell: pwsh
      
      - name: Sign binary
        run: |
          $pwd = ConvertTo-SecureString -String "${{ secrets.SIGNING_CERT_PASSWORD }}" -Force -AsPlainText
          $cert = Get-PfxCertificate -FilePath "cert.pfx" -Password $pwd
          Set-AuthenticodeSignature -FilePath "target\${{ matrix.target }}\release\thatproject.exe" `
            -Certificate $cert `
            -TimestampServer "http://timestamp.digicert.com" `
            -IncludeChain All
        shell: pwsh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thatproject-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/thatproject.exe
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/thatproject.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
